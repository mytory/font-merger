name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag to create or update"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            asset: font-merger-gui-macos-arm64
          - runner: macos-15-intel
            arch: x64
            asset: font-merger-gui-macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller==6.17.0
      - name: Build application bundle
        run: >-
          pyinstaller --noconfirm --clean --windowed --target-architecture ${{ matrix.arch }}
          --name "Font Merger" --icon assets/icons/font-merger-mac.icns --add-data "icon.png:." font_merger_gui.py
      - name: Package release asset
        run: |
          mkdir -p release/${{ matrix.asset }}
          mv "dist/Font Merger.app" release/${{ matrix.asset }}/
          cp LICENSE THIRD_PARTY_NOTICES.md release/${{ matrix.asset }}/
          ditto -c -k --sequesterRsrc --keepParent release/${{ matrix.asset }} ${{ matrix.asset }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt pyinstaller==6.17.0
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name font-merger-gui --icon assets/icons/font-merger.ico --add-data "icon.png;." font_merger_gui.py
      - name: Package release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/font-merger-gui-windows-x64 | Out-Null
          Move-Item dist/font-merger-gui release/font-merger-gui-windows-x64/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md release/font-merger-gui-windows-x64/
          Compress-Archive -Path release/font-merger-gui-windows-x64 -DestinationPath font-merger-gui-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: font-merger-gui-windows-x64.zip

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller==6.17.0
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name font-merger-gui --add-data "icon.png:." font_merger_gui.py
      - name: Package release asset
        run: |
          mkdir -p release/font-merger-gui-linux-x64
          mv dist/font-merger-gui release/font-merger-gui-linux-x64/
          cp LICENSE THIRD_PARTY_NOTICES.md release/font-merger-gui-linux-x64/
          cp assets/icons/font-merger-linux.png release/font-merger-gui-linux-x64/font-merger-gui.png
          cp packaging/linux/font-merger-gui.desktop release/font-merger-gui-linux-x64/
          tar -C release -czf font-merger-gui-linux-x64.tar.gz font-merger-gui-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: font-merger-gui-linux-x64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "Font Merger $RELEASE_TAG" \
            --generate-notes
