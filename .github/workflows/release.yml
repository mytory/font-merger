name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller==6.17.0
      - name: Build application bundle
        run: >-
          pyinstaller --noconfirm --clean --windowed --target-architecture universal2
          --name "Font Merger" --icon icon.png --add-data "icon.png:." font_merger_gui.py
      - name: Package release asset
        run: |
          mkdir -p release/font-merger-gui-macos-universal
          mv "dist/Font Merger.app" release/font-merger-gui-macos-universal/
          cp LICENSE THIRD_PARTY_NOTICES.md release/font-merger-gui-macos-universal/
          ditto -c -k --sequesterRsrc --keepParent release/font-merger-gui-macos-universal font-merger-gui-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: font-merger-gui-macos-universal.zip

  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt pyinstaller==6.17.0
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name font-merger-gui --icon icon.png --add-data "icon.png;." font_merger_gui.py
      - name: Package release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/font-merger-gui-windows-x64 | Out-Null
          Move-Item dist/font-merger-gui release/font-merger-gui-windows-x64/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md release/font-merger-gui-windows-x64/
          Compress-Archive -Path release/font-merger-gui-windows-x64 -DestinationPath font-merger-gui-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: font-merger-gui-windows-x64.zip

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller==6.17.0
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name font-merger-gui --icon icon.png --add-data "icon.png:." font_merger_gui.py
      - name: Package release asset
        run: |
          mkdir -p release/font-merger-gui-linux-x64
          mv dist/font-merger-gui release/font-merger-gui-linux-x64/
          cp LICENSE THIRD_PARTY_NOTICES.md release/font-merger-gui-linux-x64/
          tar -C release -czf font-merger-gui-linux-x64.tar.gz font-merger-gui-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: font-merger-gui-linux-x64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Font Merger $GITHUB_REF_NAME" \
            --generate-notes
